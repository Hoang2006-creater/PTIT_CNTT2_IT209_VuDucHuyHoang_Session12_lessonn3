name: Multi-Environment CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Deployment Info
        run: |
          echo "========================================"
          echo "🚀 Deploying to Staging Environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Target Environment: staging"
          echo "Target URL: https://staging.example.com"
          echo "========================================"

      - name: Simulate Staging Deployment
        run: |
          echo "Building staging application artifacts..."
          sleep 2
          echo "Deploying application to Staging server..."
          sleep 3
          echo "Running smoke tests on Staging..."
          sleep 2
          echo "✅ Staging Deployment Completed Successfully!"

  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Deployment Info
        run: |
          echo "========================================"
          echo "🚀 Deploying to Production Environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Target Environment: production"
          echo "Target URL: https://api.prod.example.com"
          echo "Deployment approved by authorized reviewer."
          echo "========================================"

      - name: Simulate Production Deployment
        run: |
          echo "Executing zero-downtime release to Production..."
          sleep 3
          echo "Applying migrations and releasing containers..."
          sleep 3
          echo "Performing final health check and sanity verification..."
          sleep 2
          echo "🎉 Production Deployment Completed Successfully!"
